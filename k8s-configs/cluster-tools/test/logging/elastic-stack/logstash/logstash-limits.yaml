apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
spec:
  template:
    spec:
      containers:
        - name: logstash
          resources:
            limits:
              cpu: "2"
              memory: 8Gi
            requests:
              cpu: "2"
              memory: 6Gi
          env:
            - name: LS_JAVA_OPTS
              value: '-Xms4g -Xmx4g -XX:MaxDirectMemorySize=2g'
            - name: PIPELINE_WORKERS
              value: "8"
            - name: PIPELINE_BATCH_SIZE
              value: "500"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic-s3
spec:
  template:
    spec:
      containers:
        - name: logstash
          resources:
            limits:
              cpu: "1"
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 3Gi
          env:
            - name: LS_JAVA_OPTS
              value: '-Xms2g -Xmx2g -XX:MaxDirectMemorySize=1g'
            - name: PIPELINE_WORKERS
              value: "12"
            - name: PIPELINE_BATCH_SIZE
              value: "1000"
