---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-s3
data:
  pipelines.yml: |
    - pipeline.id: s3
      path.config: "/usr/share/logstash/pipeline/s3"
    - pipeline.id: dlq
      path.config: "/usr/share/logstash/pipeline/dlq"
      pipeline.workers: 1

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic-s3
  labels:
    app: logstash-elastic-s3
spec:
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: logstash-elastic-s3
  template:
    metadata:
      labels:
        app: logstash-elastic-s3
    spec:
      securityContext:
        fsGroup: 1000
      serviceAccountName: logstash-elastic-s3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - logstash-elastic-s3
                topologyKey: "topology.kubernetes.io/zone"
      containers:
        - name: exporter
          image: public.ecr.aws/r2h3l6e4/pingcloud-clustertools/prom/logstash-exporter:v0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9198
              name: metrics
              protocol: TCP
          resources:
            limits:
              cpu: "500m"
              memory: 500Mi
            requests:
              cpu: "150m"
              memory: 100Mi
        - name: logstash
          image: 705370621539.dkr.ecr.us-west-2.amazonaws.com/pingcloud-monitoring/logstash:pdo-11091-logstash
          imagePullPolicy: Always
          command:
            - "/bin/sh"
          args:
            - "-c"
            - "S3_BUCKET_NAME=${S3_BUCKET#s3://} /usr/local/bin/docker-entrypoint"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            - name: CONTAINER_NAME
              value: logstash
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONFIG_RELOAD_AUTOMATIC
              value: 'false'
            - name: LOG_FORMAT
              value: json
            - name: PIPELINE_BATCH_SIZE
              value: '1000'
            - name: PIPELINE_WORKERS
              value: "4"
            - name: PIPELINE_ECS_COMPATIBILITY
              value: disabled
            - name: PIPELINE_ORDERED
              value: 'false'
            - name: QUEUE_TYPE
              value: persisted
            - name: QUEUE_MAX_BYTES
              value: 10gb
            - name: QUEUE_DRAIN
              value: "true"
            - name: DEAD_LETTER_QUEUE_ENABLE
              value: "true"
            - name: PATH_DEAD_LETTER_QUEUE
              value: "/usr/share/logstash/data/queue/dead_letter"
            - name: LS_JAVA_OPTS
              value: "-Xms768m -Xmx768m"
            - name: XPACK_MONITORING_ENABLED
              value: "false"
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: s3-raw-logs-bucket
                  key: bucketName
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: cluster-info
                  key: logs.region
            - name: CW_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: cluster-info
                  key: cluster.name
          envFrom:
            - configMapRef:
                name: elk-environment-variables
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 300
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 10
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 3
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /
              port: 8081
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "400m"
              memory: 2Gi
            requests:
              cpu: "100m"
              memory: 768Mi
          ports:
            - containerPort: 9600
              name: rest
              protocol: TCP
            - containerPort: 8081
              name: http-s3-input
              protocol: TCP
          volumeMounts:
            - name: logstash-pipelines-s3
              mountPath: /usr/share/logstash/config/pipelines.yml
              subPath: pipelines.yml
            - name: logstash-s3-gp3
              mountPath: /usr/share/logstash/data/queue
              readOnly: false
      terminationGracePeriodSeconds: 60
      volumes:
        - name: logstash-pipelines-s3
          configMap:
            name: pipeline-s3
            items:
              - key: pipelines.yml
                path: pipelines.yml
  serviceName: logstash-elastic-s3
  volumeClaimTemplates:
    - metadata:
        name: logstash-s3-gp3
        annotations:
          volume.autoscaler.kubernetes.io/scale-above-percent: "85"
          volume.autoscaler.kubernetes.io/scale-up-percent: "25"
        labels:
          app: logstash-elastic-s3
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: logstash-gp3
        resources:
          requests:
            storage: 50Gi

---
kind: Service
apiVersion: v1
metadata:
  name: logstash-elastic-s3
  labels:
    app: logstash-elastic-s3
spec:
  selector:
    app: logstash-elastic-s3
  ports:
    - port: 9600
      name: rest
    - port: 8081
      name: http-s3-input
    - port: 9198
      name: metrics

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logstash-elastic-s3
  labels:
    app: logstash-elastic-s3

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: logstash-elastic-s3
roleRef:
  kind: ClusterRole
  name: logstash-elastic
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: logstash-elastic-s3
