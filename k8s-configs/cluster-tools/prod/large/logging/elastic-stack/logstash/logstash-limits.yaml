apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
spec:
  template:
    spec:
      containers:
        - name: logstash
          resources:
            limits:
              cpu: "4"
              memory: 14Gi
            requests:
              cpu: "4"
              memory: 10Gi
          env:
            - name: LS_JAVA_OPTS
              value: '-Xms8g -Xmx8g -XX:MaxDirectMemorySize=2g'
            - name: PIPELINE_WORKERS
              value: "16"
            - name: PIPELINE_BATCH_SIZE
              value: "500"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic-s3
spec:
  template:
    spec:
      containers:
        - name: logstash
          resources:
            limits:
              cpu: "3"
              memory: 8Gi
            requests:
              cpu: "2"
              memory: 6Gi
          env:
            - name: LS_JAVA_OPTS
              value: '-Xms4g -Xmx4g -XX:MaxDirectMemorySize=1g'
            - name: PIPELINE_WORKERS
              value: "24"
            - name: PIPELINE_BATCH_SIZE
              value: "1000"
