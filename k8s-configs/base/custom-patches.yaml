##################################################################################################################
# NOTE:  This is a temporary file that is used to deploy custom patches as an interim solution while P1AS CI/CD
#        moves away from dev-cluster-state for deploying clusters.  It's contents will be copied over to 
#        ping-cloud-base/code-gen/templates/common/base/custom-patches.yaml and overwrite any data there.  
#
#        Currently we have no way to access private endpoints from our CI/CD runners, so we make them publicly 
#        available in CI/CD only.  The below kustomize patch merges replaces the annotations of services,
#        w/o the 'internal' annotation, making it default to public.
##################################################################################################################

### Always leave in at least this customization. Otherwise, kustomize will complain about an empty patch file. ###
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-environment-variables
  namespace: ping-cloud

---

kind: Service
apiVersion: v1
metadata:
  name: ingress-nginx
  namespace: ingress-nginx-private
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    $patch: replace


---

kind: Service
apiVersion: v1
metadata:
  name: pingdatasync-admin
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    external-dns.alpha.kubernetes.io/hostname: pingdatasync-dev.${TENANT_DOMAIN}
    $patch: replace

---

apiVersion: v1
kind: Secret
metadata:
  name: customer-p1-app
  namespace: argocd
data:
  CLIENT_ID: 
  CLIENT_SECRET: 
  ISSUER: 
  $patch: replace

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
spec:
  replicas: 0
---

# Bring Karpenter replicas down to 1 to save costs
# NOTE: replicas will be updated to 0 if cluster autoscaler is enabled. This is done in dev_cde_aliases.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter
  namespace: kube-system
spec:
  replicas: 1

---

apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
    name: default
spec:
    template:
      spec:
        requirements:
          - key: "karpenter.k8s.aws/instance-category"
            operator: In
            values: ["c", "m", "r", "t"]
          # Ignore instances which cause issues with ingress controller due to not being able to assign by instance ID
          # Exclude x86-only types for those clusters that flip to x86 later in the patching process
          - key: "karpenter.k8s.aws/instance-family"
            operator: NotIn
            values: ["c1", "m1", "m2", "m3", "t1"]
          - key: "kubernetes.io/arch"
            operator: In
            values: ["arm64"]
          - key: "karpenter.sh/capacity-type"
            operator: In
            values: ["spot", "on-demand"]
          - key: kubernetes.io/os
            operator: In
            values: ["linux"]

---

apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: pd-only
spec:
  template:
    spec:
      requirements:
          - key: "karpenter.k8s.aws/instance-category"
            operator: In
            values: ["c", "m", "r", "t"]
          # Ignore instances which cause issues with ingress controller due to not being able to assign by instance ID
          # Exclude x86-only types for those clusters that flip to x86 later in the patching process
          - key: "karpenter.k8s.aws/instance-family"
            operator: NotIn
            values: ["c1", "m1", "m2", "m3", "t1"]
          - key: "kubernetes.io/arch"
            operator: In
            values: ["arm64"]
          - key: "karpenter.sh/capacity-type"
            operator: In
            values: ["spot", "on-demand"]
          - key: kubernetes.io/os
            operator: In
            values: ["linux"]
